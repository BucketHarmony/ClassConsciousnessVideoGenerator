[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-ken-burns"
version = "0.1.0"
description = "AI-powered Ken Burns video generator - creates pan/zoom videos from audio"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["video", "ken-burns", "ai", "ffmpeg", "audio", "slideshow"]
authors = [
    { name = "AI Ken Burns Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydub>=0.25.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "ollama>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
all = [
    "ai-ken-burns[llm,dev]",
]

[project.scripts]
ai-ken-burns = "ai_ken_burns.cli:app"

[project.urls]
Documentation = "https://github.com/ai-ken-burns/ai-ken-burns#readme"
Issues = "https://github.com/ai-ken-burns/ai-ken-burns/issues"
Source = "https://github.com/ai-ken-burns/ai-ken-burns"

[tool.hatch.build.targets.wheel]
packages = ["ai_ken_burns"]

[tool.black]
target-version = ["py310"]
line-length = 100

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=ai_ken_burns --cov-report=term-missing"
